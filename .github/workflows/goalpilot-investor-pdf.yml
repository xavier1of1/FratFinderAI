name: Build GoalPilot Investor PDF

on:
  pull_request:
    branches:
      - main
    paths:
      - '.goalpilot-pdf/**'
      - '.github/workflows/goalpilot-investor-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install PDF toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf pymupdf pillow

      - name: Generate and validate PDF
        run: python .goalpilot-pdf/build_investor_plan.py

      - name: Render page previews and contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz
          from PIL import Image, ImageOps, ImageDraw

          out = Path('.goalpilot-pdf/output')
          pdf = out / 'GoalPilot_Cash_Investor_Business_Plan.pdf'
          preview_dir = out / 'previews'
          preview_dir.mkdir(parents=True, exist_ok=True)
          doc = fitz.open(pdf)
          thumbs = []
          for i, page in enumerate(doc):
              pix = page.get_pixmap(matrix=fitz.Matrix(1.35, 1.35), alpha=False)
              png = preview_dir / f'page-{i+1:02d}.png'
              pix.save(png)
              im = Image.open(png).convert('RGB')
              im.thumbnail((260, 336))
              tile = Image.new('RGB', (280, 370), 'white')
              tile.paste(im, ((280-im.width)//2, 12))
              d = ImageDraw.Draw(tile)
              d.text((12, 348), f'Page {i+1}', fill='#003B2A')
              thumbs.append(tile)

          cols = 2
          rows = (len(thumbs) + cols - 1) // cols
          sheet = Image.new('RGB', (cols*280, rows*370), '#E8EEE9')
          for idx, im in enumerate(thumbs):
              sheet.paste(im, ((idx % cols)*280, (idx // cols)*370))
          sheet.save(out / 'GoalPilot_Cash_Investor_Business_Plan_preview.png', quality=92)
          print(f'Rendered {len(thumbs)} pages')
          PY

      - name: Verify output files
        run: |
          test -s .goalpilot-pdf/output/GoalPilot_Cash_Investor_Business_Plan.pdf
          test -s .goalpilot-pdf/output/GoalPilot_Cash_Investor_Business_Plan_preview.png
          test -s .goalpilot-pdf/output/GoalPilot_Cash_Investor_Business_Plan_validation.txt
          ls -lh .goalpilot-pdf/output

      - name: Commit generated deliverables to source branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'goalpilot-pdf-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .goalpilot-pdf/output
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'docs: generate GoalPilot investor PDF [skip ci]'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload investor deliverables
        uses: actions/upload-artifact@v4
        with:
          name: goalpilot-investor-business-plan
          path: |
            .goalpilot-pdf/output/GoalPilot_Cash_Investor_Business_Plan.pdf
            .goalpilot-pdf/output/GoalPilot_Cash_Investor_Business_Plan_preview.png
            .goalpilot-pdf/output/GoalPilot_Cash_Investor_Business_Plan_validation.txt
          retention-days: 30
